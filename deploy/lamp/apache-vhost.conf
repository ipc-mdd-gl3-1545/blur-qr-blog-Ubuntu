# 模糊二维码 · 博客 LAMP 版 Apache 虚拟主机配置
# 放到 /etc/apache2/sites-available/blog.conf 然后 a2ensite blog && systemctl reload apache2
# 按需把 ServerName / 路径改成你的实际值。

<VirtualHost *:80>
    ServerName 192.168.5.4
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/blog

    <Directory /var/www/blog>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # ---- 敏感文件与目录：一律拒绝直接访问 ----
    <FilesMatch "^(admin\.html|\.env|config\.php|bootstrap\.php|admin\.php|composer\.json)$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/(data|api|deploy|tools|vendor)/">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "\.(db|sql|log|key|ini|sh|service|bak)$">
        Require all denied
    </FilesMatch>

    # ---- 重写规则 ----
    RewriteEngine On

    # 后台入口：/manage → api/manage.php（路径要与 config.php 的 ADMIN_PATH 一致）
    RewriteRule ^manage/?$ /api/manage.php [L,QSA]

    # 允许直接访问的 PHP 入口（index/manage/sample）；其余配置文件禁止直连
    RewriteRule ^api/(index|manage|sample)\.php$ - [L]
    RewriteRule ^api/.+$ /api/index.php [L,QSA]

    # 健康检查：交给入口文件处理
    RewriteRule ^healthz$ /api/index.php [L,QSA]

    # 静态资源 / 干净 URL：文件不存在就补 .html
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^([^\.]+)$ /$1.html [L]

    # ---- 安全响应头 ----
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ---- 压缩（替代原 Node 的 gzip）----
    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/json application/javascript image/svg+xml

    # ---- 静态资源缓存（文件名带 hash，可长期缓存）----
    <Directory "/var/www/blog/assets">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Directory "/var/www/blog/web/assets">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Directory "/var/www/blog/uploads">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # ---- CDN 预留 ----
    # 新版前端在 web/ 下构建；接真实 CDN 时复制 web/.env.example 为 web/.env，
    # 填 VITE_CDN_BASE=https://你的CDN域名/ ，重新 npm run build 即可。

    # ---- 允许大文件上传（视频）----
    LimitRequestBody 4294967296

    ErrorLog ${APACHE_LOG_DIR}/blog-error.log
    CustomLog ${APACHE_LOG_DIR}/blog-access.log combined
}
